<!doctype html>
<html>
<head><title>MyBank - Account Statement</title>
<meta charset="utf-8">
<style>
body{font-family:system-ui;max-width:700px;margin:20px auto;padding:20px}
h1{font-size:1.1em;border-bottom:1px solid #ddd;padding-bottom:6px}
.iframe{border:3px solid #c00;width:100%;height:280px}
button{display:block;width:100%;padding:12px;margin:8px 0;font-size:14px;cursor:pointer;border:1px solid #ccc;border-radius:5px;background:#f5f5f5}
button.print{background:#c00;color:#fff;font-size:16px}
pre{background:#f8f8f8;border:1px solid #eee;padding:10px;font-size:11px;font-family:monospace;white-space:pre-wrap;min-height:40px;max-height:160px;overflow:auto}
</style>
</head>
<body>
<h1>Account Statement</h1>
<p>Your balance: <b>$12,847.32</b></p>
<pre id="info"></pre>

<iframe class="iframe" src="http://localhost:9081/victim.html"></iframe>

<script>
var info = document.getElementById('info');
info.textContent = 'URL: ' + location.href + '\n';
info.textContent += 'Query: ' + location.search + '\n';
info.textContent += 'Origin: ' + location.origin;

// The iframe below cannot read top.location.href (blocked by SOP).\n';
// But if it calls window.print(), the print header/footer will contain\n';
// this page\'s full URL and title — delivered into the iframe\'s renderer.
</script>
</body>
</html>
