<!doctype html>
<html><head><title>ad frame</title></head>
<body style="font-family:sans-serif;background:#ffe;padding:12px">
  <h3>Cross-origin iframe (origin B: localhost:8081)</h3>
  <p>I cannot read my embedder's URL or title via any documented API:
     <code>document.referrer</code> is policy-controlled, and
     <code>top.location.href</code> throws.</p>
  <p id="probe"></p>
  <button style="font-size:16px;padding:8px 14px" onclick="window.print()">
    window.print() &mdash; no user gesture required by the code path
  </button>
  <script>
    let out = [];
    try { out.push('top.location.href = ' + top.location.href); }
    catch (e) { out.push('top.location.href -> BLOCKED (' + e.name + ')'); }
    out.push('document.referrer = ' + (document.referrer || '(empty)'));
    document.getElementById('probe').innerHTML = out.join('<br>');
  </script>
</body></html>
