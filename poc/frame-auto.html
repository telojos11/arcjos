<!doctype html>
<html><head><title></title></head>
<body style="font-family:sans-serif;background:#fef;padding:12px">
  <h3>Cross-origin iframe, auto-print, NO user gesture (origin B)</h3>
  <p>This frame calls <code>window.print()</code> from a load handler. Nothing
     was clicked inside it. Empty &lt;title&gt; so the embedder's title also
     surfaces via the fallback at print_render_frame_helper.cc:609.</p>
  <script>
    // IsScriptInitiatedPrintAllowed returns
    //   user_initiated || g_is_preview_enabled || scripting_throttler_.IsAllowed(frame)
    // and g_is_preview_enabled is true on desktop, so no activation is needed.
    addEventListener('load', () => setTimeout(() => window.print(), 800));
  </script>
</body></html>
