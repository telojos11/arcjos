<!doctype html>
<script>
var t0 = performance.now();
navigator.mediaDevices.getUserMedia({video:true})
  .then(s => { s.getTracks().forEach(t => t.stop()); document.title = 'GRANTED ' + (performance.now()-t0).toFixed(0) + 'ms'; })
  .catch(e => { document.title = e.name + ' ' + (performance.now()-t0).toFixed(1) + 'ms'; });
</script>
